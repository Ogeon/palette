on:
  pull_request:
    branches:
      - master
    paths:
      - '**.rs'
      - 'codecov.yml'
  push:
    branches:
      - master
    paths:
      - '**.rs'
      - 'codecov.yml'

name: Test coverage

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo install cargo-expand
      - name: Collect code coverage
        run: >
          cargo +nightly llvm-cov --all-features --doctests --codecov --output-path codecov.json
          -p integration_tests
          -p derive_ui_tests
          -p palette
          -p palette_derive
          -p palette_codegen
          -p palette_math
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
